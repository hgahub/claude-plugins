name: CI

on:
  push:
    branches: [main]
    # Skill instructions and generated knowledge-base templates are runtime inputs.
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'plugins/*/README.md'
      - 'plugins/*/docs/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'plugins/*/README.md'
      - 'plugins/*/docs/**'
  workflow_call:

permissions:
  contents: read

jobs:
  scripts:
    name: Python scripts (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest tzdata
      - name: Check plugin and marketplace versions
        run: python scripts/version.py
      - run: python -m pytest plugins/hga/tests/py -q

  plugin:
    name: Plugin validate, pane tests and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate plugins/hga
      - run: claude plugin test plugins/hga
      - run: npm ci
      - name: Generate the plugin's types (no API key, no model call)
        run: scripts/plugin-types.sh
      - run: npm run typecheck
